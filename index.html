<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ALLCON // Buyout Portal</title>
  <!-- FAVICON PLACED HERE -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231E1E1E'/><path d='M30 35 L50 25 L70 35 L70 65 L50 75 L30 65 Z' stroke='%233A86FF' stroke-width='6' fill='none'/><path d='M50 25 L50 75 M30 35 L70 35' stroke='%233A86FF' stroke-width='6'/></svg>">
  <style>
    :root {
      --bg-dark: #0f1115;
      --card-bg: #181b21;
      --card-hover: #21252d;
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f3f8;
      --text-grey: #8c96a5;
      
      --norman-blue: #3a86ff;
      --norlene-pink: #ff007f;
      
      --status-green: #2ecc71;
      --status-orange: #e67e22;
      --status-purple: #9b59b6;
      --status-red: #e74c3c;
      --status-yellow: #f1c40f;
      --status-white: #5a6578;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      margin: 0;
      padding: 30px;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Controls Bar */
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1px;
      margin: 0 0 20px 0;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h1::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 22px;
      background: var(--norman-blue);
      border-radius: 2px;
    }

    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 28px;
      align-items: center;
    }

    select, .search-input {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    select:focus, .search-input:focus {
      border-color: var(--norman-blue);
      box-shadow: 0 0 0 3px rgba(58, 134, 255, 0.15);
    }

    .search-input { min-width: 260px; flex-grow: 1; }

    /* Grid & Cards */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 18px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      transform: translateY(-3px);
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.18);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .ac-number {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }

    .project-name {
      font-size: 12px;
      color: var(--text-grey);
      font-weight: 500;
      line-height: 1.4;
      text-transform: uppercase;
      margin-top: 4px;
      word-break: break-word;
    }

    /* Owner Badges */
    .owner-badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .owner-norman {
      background: rgba(58, 134, 255, 0.12);
      color: var(--norman-blue);
      border: 1px solid rgba(58, 134, 255, 0.3);
    }

    .owner-norlene {
      background: rgba(255, 0, 127, 0.12);
      color: var(--norlene-pink);
      border: 1px solid rgba(255, 0, 127, 0.3);
    }

    .owner-unassigned {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-grey);
      border: 1px solid var(--border-color);
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 15px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .dots-container { display: flex; gap: 6px; align-items: center; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-green { background: var(--status-green); box-shadow: 0 0 6px var(--status-green); }
    .dot-orange { background: var(--status-orange); box-shadow: 0 0 6px var(--status-orange); }
    .dot-purple { background: var(--status-purple); box-shadow: 0 0 6px var(--status-purple); }
    .dot-red { background: var(--status-red); box-shadow: 0 0 6px var(--status-red); }
    .dot-yellow { background: var(--status-yellow); box-shadow: 0 0 6px var(--status-yellow); }
    .dot-white { background: var(--status-white); opacity: 0.8; }

    /* Modal Overlay UI */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px); z-index: 1000; justify-content: center; align-items: center; }
    .modal-content { background: #181b21; border: 1px solid var(--border-color); border-radius: 12px; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; border-bottom: 1px solid var(--border-color); padding-bottom: 15px; }
    .close-btn { background: none; border: none; color: #aaa; font-size: 1.8rem; cursor: pointer; padding: 0; }
    .close-btn:hover { color: #fff; }

    .item-card { background: #21252d; border-radius: 8px; padding: 15px; margin-bottom: 12px; border-left: 4px solid #555; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
    .item-card.border-green { border-left-color: var(--status-green); }
    .item-card.border-orange { border-left-color: var(--status-orange); }
    .item-card.border-purple { border-left-color: var(--status-purple); }
    .item-card.border-red { border-left-color: var(--status-red); }
    .item-card.border-yellow { border-left-color: var(--status-yellow); }
    .item-card.border-white { border-left-color: var(--status-white); }
    
    .field-label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-grey); margin-bottom: 2px; }
    .field-value { font-size: 0.9rem; font-weight: 500; }
  </style>
</head>
<body>

  <h1>ALLCON BUYOUT PORTAL</h1>
  
  <div class="toolbar">
    <select id="owner-select" onchange="filterAndRender()">
      <option value="ALL">Show All Owners</option>
      <option value="NORMAN">Norman</option>
      <option value="NORLENE">Norlene</option>
      <option value="UNASSIGNED">Unassigned</option>
    </select>

    <select id="sort-select" onchange="filterAndRender()">
      <option value="NEWEST">Newest First (Sheet Bottom)</option>
      <option value="OLDEST">Oldest First (Sheet Top)</option>
    </select>

    <input type="text" id="search-input" class="search-input" placeholder="Search by Project Name or AC Number..." oninput="filterAndRender()">
  </div>

  <div id="card-grid" class="card-grid"></div>

  <!-- Detail Modal -->
  <div id="detail-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-header">
        <div>
          <h2 id="modal-ac" style="margin:0; color:#fff;"></h2>
          <div id="modal-project" style="color:var(--text-grey); margin-top:4px;"></div>
        </div>
        <button class="close-btn" onclick="closeModal()">&times;</button>
      </div>
      <div id="modal-items"></div>
    </div>
  </div>

  <script>
    let projectsData = [];

    const STATUS_LABELS = {
      'white': 'NOT ACTIONED',
      'green': 'FINISH',
      'orange': 'ORDER SENT, NOT RECEIVED',
      'purple': 'QUERY / CHECK COMMENTS',
      'red': 'ON HOLD',
      'yellow': 'WAITING FOR QUOTES OR FEEDBACK'
    };

    fetch('projects_data.json')
      .then(res => res.json())
      .then(data => {
        projectsData = data;
        filterAndRender();
      });

    function filterAndRender() {
      const ownerFilter = document.getElementById('owner-select').value;
      const sortOrder = document.getElementById('sort-select').value;
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      
      const grid = document.getElementById('card-grid');
      grid.innerHTML = '';

      let processed = projectsData.filter(p => {
        const matchesOwner = (ownerFilter === 'ALL') || (p.owner.toUpperCase() === ownerFilter.toUpperCase());
        const matchesSearch = !query || 
          p.ac_number.toLowerCase().includes(query) || 
          p.project_name.toLowerCase().includes(query);
        
        return matchesOwner && matchesSearch;
      });

      if (sortOrder === 'NEWEST') {
        processed = [...processed].reverse();
      }

      processed.forEach(p => {
        const colors = new Set();
        p.items.forEach(item => colors.add(item.status_color));

        const dotsHTML = Array.from(colors)
          .map(c => `<span class="dot dot-${c}" title="${STATUS_LABELS[c] || c.toUpperCase()}"></span>`).join('');

        let ownerClass = 'owner-unassigned';
        if (p.owner.toUpperCase() === 'NORMAN') ownerClass = 'owner-norman';
        if (p.owner.toUpperCase() === 'NORLENE') ownerClass = 'owner-norlene';

        const cardHTML = `
          <div class="card" onclick="openModal(${projectsData.indexOf(p)})">
            <div class="card-header">
              <div>
                <div class="ac-number">${p.ac_number}</div>
                <div class="project-name">${p.project_name}</div>
              </div>
              <span class="owner-badge ${ownerClass}">${p.owner}</span>
            </div>
            <div class="status-bar">
              <div class="dots-container">${dotsHTML}</div>
              <span style="font-size:0.8rem; color:var(--text-grey);">${p.items.length} items</span>
            </div>
          </div>
        `;
        grid.innerHTML += cardHTML;
      });
    }

    function openModal(originalIndex) {
      const p = projectsData[originalIndex];
      document.getElementById('modal-ac').innerText = p.ac_number;
      document.getElementById('modal-project').innerText = (p.project_name !== p.ac_number ? p.project_name + " • " : "") + p.owner;

      const itemsContainer = document.getElementById('modal-items');
      itemsContainer.innerHTML = '';

      p.items.forEach(i => {
        itemsContainer.innerHTML += `
          <div class="item-card border-${i.status_color}">
            <div>
              <div class="field-label">Component</div>
              <div class="field-value"><strong>${i.component}</strong></div>
            </div>
            <div>
              <div class="field-label">Supplier</div>
              <div class="field-value">${i.supplier || '-'} ${i.supplier_contact ? '(' + i.supplier_contact + ')' : ''}</div>
            </div>
            <div>
              <div class="field-label">PO / Date</div>
              <div class="field-value">${i.po_nr || '-'} ${i.date_po ? '/ ' + i.date_po : ''}</div>
            </div>
            <div>
              <div class="field-label">Received</div>
              <div class="field-value">${i.received ? 'YES (' + (i.date_received || 'No date') + ')' : 'NO'}</div>
            </div>
            <div style="grid-column: 1 / -1;">
              <div class="field-label">Comments / Status (${STATUS_LABELS[i.status_color]})</div>
              <div class="field-value" style="color:#ffcc00;">${i.comments || 'No comments'}</div>
            </div>
          </div>
        `;
      });

      document.getElementById('detail-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detail-modal').style.display = 'none';
    }
  </script>
</body>
</html>
