name: Smartsheet Cloud Sync

on:
  schedule:
    - cron: '*/15 * * * *' # Runs every 15 minutes automatically
  workflow_dispatch: # Allows manual trigger button in GitHub

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Smartsheet SDK
        run: pip install smartsheet-python-sdk

      - name: Run Data Collector
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
        run: python fetch_data.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add projects_data.json
          git commit -m "Auto-sync Smartsheet data" || exit 0
          git push
